<!doctype html>
<html lang="id">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#4f46e5">
        <title>Rancaka POS - Offline</title>
        <style>
            * { box-sizing: border-box; }
            body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #080e1a; color: #e2e8f0; font-family: system-ui, sans-serif; }
            main { max-width: 420px; text-align: center; }
            img { width: 88px; height: 88px; border-radius: 22px; }
            h1 { margin: 24px 0 8px; font-size: 24px; }
            p { margin: 0; color: #94a3b8; line-height: 1.6; }
            button { margin-top: 24px; border: 0; border-radius: 12px; padding: 12px 18px; background: #4f46e5; color: white; font-weight: 700; cursor: pointer; }
        </style>
    </head>
    <body>
        <main>
            <img src="/pwa/icon-192.png" alt="Rancaka POS">
            <h1>Koneksi terputus</h1>
            <p>Sambungkan perangkat ke internet untuk melanjutkan transaksi dengan aman.</p>
            <button type="button" onclick="location.reload()">Coba lagi</button>
        </main>
    </body>
</html>
